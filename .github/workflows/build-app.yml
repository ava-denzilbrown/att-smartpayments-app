name: Build Smart Payments

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-java caches Maven dependencies between runs.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR exists
        run: test -f target/smartpayments.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartpayments-war
          path: target/smartpayments.war
          if-no-files-found: error

      # Exchange GitHub's OIDC token for an Azure identity; no client secret is needed.
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload WAR to Azure Blob Storage
        run: |
          az storage blob upload \
            --account-name sasmartpaymentspoc \
            --container-name smartpayments-artifacts \
            --name smartpayments-${{ github.sha }}.war \
            --file target/smartpayments.war \
            --auth-mode login
