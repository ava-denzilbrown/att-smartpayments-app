name: Build Smart Payments

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # setup-java caches Maven dependencies between runs.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR exists
        run: test -f target/smartpayments.war

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartpayments-war
          path: target/smartpayments.war
          if-no-files-found: error
